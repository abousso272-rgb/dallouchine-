    <style>
      /* Écran de démarrage : affiché instantanément, remplacé par l'application */
      html,body{margin:0;background:#faf6f1;color:#0b1620;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
      .boot{min-height:100dvh;display:flex;flex-direction:column}
      .boot-bar{height:64px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #ece4da;background:rgba(250,246,241,.8)}

      .boot-logo:after{content:"";position:absolute;left:7px;right:7px;top:13px;height:9px;border:3px solid #f2560f;border-bottom:0;border-radius:12px 12px 0 0}
      .boot-name{font-weight:800;letter-spacing:.04em;font-size:16px}
      .boot-hero{padding:48px 16px;max-width:1200px;margin:0 auto;width:100%;box-sizing:border-box}
      .boot-line{height:14px;border-radius:7px;background:linear-gradient(90deg,#efe7dd 0,#f7f1ea 40%,#efe7dd 80%);background-size:400px 100%;animation:bootsh 1.2s linear infinite;margin-bottom:14px}
      @keyframes bootsh{0%{background-position:-400px 0}100%{background-position:400px 0}}
      @media (min-width:640px){.boot-bar{padding:0 32px}.boot-hero{padding:80px 32px}}
    </style>
